name: Flatpak

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release and attach Flatpak, tarball, and .deb
        type: boolean
        default: false

jobs:
  flatpak:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: dev.kakwit.PinchBowl-x86_64.flatpak
          manifest-path: flatpak/dev.kakwit.PinchBowl.yml
          artifact-name: dev.kakwit.PinchBowl-x86_64.flatpak

  dist:
    name: Dist packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3 dpkg-dev

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n "s/^  version: '\\([^']*\\)',$/\\1/p" meson.build | head -n1)
          fi
          if [ -z "$version" ]; then
            echo "Could not determine VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build tarball and deb
        run: VERSION="${{ steps.ver.outputs.version }}" ./scripts/build-release-packages.sh

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pinchbowl-dist
          path: |
            dist/pinchbowl-*.tar.gz
            dist/pinchbowl_*_all.deb

  release:
    name: Publish
    needs: [flatpak, dist]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the repository
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Read version from meson.build
        if: github.event_name == 'workflow_dispatch'
        id: ver
        run: |
          version=$(sed -n "s/^  version: '\\([^']*\\)',$/\\1/p" meson.build | head -n1)
          if [ -z "$version" ]; then
            echo "Could not read version from meson.build" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download the Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: dev.kakwit.PinchBowl-x86_64.flatpak
          path: dist

      - name: Download tarball and deb
        uses: actions/download-artifact@v4
        with:
          name: pinchbowl-dist
          path: dist

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && steps.ver.outputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && steps.ver.outputs.tag || github.ref_name }}
          files: |
            dist/dev.kakwit.PinchBowl-x86_64.flatpak
            dist/pinchbowl-*.tar.gz
            dist/pinchbowl_*_all.deb
          generate_release_notes: true
