name: Flatpak

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release and attach the Flatpak bundle
        type: boolean
        default: false

jobs:
  flatpak:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: dev.kakwit.PinchBowl-x86_64.flatpak
          manifest-path: flatpak/dev.kakwit.PinchBowl.yml
          artifact-name: dev.kakwit.PinchBowl-x86_64.flatpak

  release:
    name: Publish
    needs: flatpak
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the repository
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Read version from meson.build
        if: github.event_name == 'workflow_dispatch'
        id: ver
        run: |
          version=$(sed -n "s/^  version: '\\([^']*\\)',$/\\1/p" meson.build | head -n1)
          if [ -z "$version" ]; then
            echo "Could not read version from meson.build" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          name: dev.kakwit.PinchBowl-x86_64.flatpak
          path: dist

      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && steps.ver.outputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && steps.ver.outputs.tag || github.ref_name }}
          files: dist/dev.kakwit.PinchBowl-x86_64.flatpak
          generate_release_notes: true
