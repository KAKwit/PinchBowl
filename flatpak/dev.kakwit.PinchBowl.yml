app-id: dev.kakwit.PinchBowl
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: pinch-bowl
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/pkgconfig
modules:
  # GSound is not in the GNOME Platform; needed for cook-timer alerts.
  # libcanberra is required to build GSound and is also absent from the SDK.
  - name: gsound
    buildsystem: meson
    config-opts:
      - -Dintrospection=true
      - -Denable_vala=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gsound/1.0/gsound-1.0.3.tar.xz
        sha256: ca2d039e1ebd148647017a7f548862350bc9af01986d39f10cfdc8e95f07881a
    modules:
      - name: libcanberra
        config-opts:
          - --disable-static
          - --disable-gtk-doc
          - --disable-oss
          - --enable-pulse
          - --disable-udev
          - --disable-alsa
          - --disable-null
          - --disable-gtk
          - --disable-gtk3
          - --disable-lynx
        cleanup:
          - /bin
          - /etc
          - /include
          - /lib/pkgconfig
          - /libexec
          - /share
          - "*.la"
        sources:
          - type: archive
            url: https://ftp2.osuosl.org/pub/blfs/conglomeration/libcanberra/libcanberra-0.30.tar.xz
            mirror-urls:
              - http://0pointer.de/lennart/projects/libcanberra/libcanberra-0.30.tar.xz
            sha256: c2b671e67e0c288a69fc33dc1b6f1b534d07882c2aceed37004bf48c601afa72
  - name: pinch-bowl
    buildsystem: meson
    sources:
      - type: dir
        path: ..
