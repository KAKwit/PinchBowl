app-id: dev.kakwit.PinchBowl
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: pinch-bowl
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/pkgconfig
modules:
  # GSound is not in the GNOME Platform; needed for cook-timer alerts.
  - name: gsound
    buildsystem: meson
    config-opts:
      - -Dintrospection=true
      - -Denable_vala=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gsound/1.0/gsound-1.0.3.tar.xz
        sha256: ca2d039e1ebd148647017a7f548862350bc9af01986d39f10cfdc8e95f07881a
  - name: pinch-bowl
    buildsystem: meson
    sources:
      - type: dir
        path: ..
